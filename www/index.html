<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scraping Browser Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .navbar {
            background-color: var(--surface-color);
            padding: 10px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }
        .navbar button {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        .url-input-container {
            flex-grow: 1;
            display: flex;
            background: var(--bg-color);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 5px 15px;
        }
        .url-input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .viewport {
            flex-grow: 1;
            position: relative;
            background: #ffffff;
        }
        /* Iframe sekarang dibuat full width/height tanpa border */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .overlay-loader {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            font-weight: bold;
        }
        .tools-panel {
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            height: 200px;
            display: flex;
            flex-direction: column;
        }
        .tools-header {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: #888;
        }
        .console-log {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            background: #000;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px dashed #333; padding-bottom: 2px; }
        .log-success { color: #03dac6; }
        .log-error { color: #cf6679; }
        .log-warn { color: #ffb86c; }
    </style>
</head>
<body>

    <div class="navbar">
        <button onclick="document.getElementById('browserFrame').contentWindow.history.back()">◀</button>
        <div class="url-input-container">
            <input type="url" id="urlInput" placeholder="https://example.com" value="https://example.com">
        </div>
        <button onclick="loadUrl()">GO</button>
    </div>

    <div class="viewport">
        <iframe id="browserFrame"></iframe>
        <div class="overlay-loader" id="loader">Memuat Halaman...</div>
    </div>

    <div class="tools-panel">
        <div class="tools-header">
            <span>🛠️ Console Log</span>
            <button onclick="clearConsole()" style="background:none;border:none;color:white;cursor:pointer;">🗑️ Clear</button>
        </div>
        <div class="console-log" id="consoleLog">
            <div class="log-entry log-success">Ready: Sandbox dilepas. JS & Cookie aktif.</div>
        </div>
    </div>

    <script>
        const browserFrame = document.getElementById('browserFrame');
        const urlInput = document.getElementById('urlInput');
        const loader = document.getElementById('loader');
        const consoleLog = document.getElementById('consoleLog');

        function log(msg, type = 'normal') {
            const div = document.createElement('div');
            let className = 'log-entry';
            if (type === 'success') className += ' log-success';
            if (type === 'error') className += ' log-error';
            if (type === 'warn') className += ' log-warn';
            
            div.className = className;
            div.textContent = `> ${msg}`;
            consoleLog.appendChild(div);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function clearConsole() {
            consoleLog.innerHTML = '<div class="log-entry">Console dibersihkan.</div>';
        }

        function loadUrl() {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            
            log(`Membuka: ${url}`);
            loader.style.display = 'flex';
            
            // Memuat URL ke dalam iframe yang sudah bebas sandbox
            browserFrame.src = url;
        }

        // Event listener saat iframe selesai dimuat
        browserFrame.onload = () => {
            loader.style.display = 'none';
            log(`Halaman selesai dimuat.`, 'success');
            
            try {
                // Mencoba membaca isi iframe (Akan gagal jika beda domain karena CORS)
                const frameDoc = browserFrame.contentDocument || browserFrame.contentWindow.document;
                log(`Judul Halaman: ${frameDoc.title}`, 'success');
            } catch (e) {
                log(`INFO Keamanan: Website memblokir akses baca dari luar (CORS/Cross-Origin). Ini normal untuk iframe.`, 'warn');
            }
        };
    </script>
</body>
</html>
