name: Build Android APK Otomatis

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Menggunakan Java 17 agar lebih stabil dengan Gradle/Capacitor
      - name: Siapkan Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3

      # BAGIAN BARU: Membuat folder www dan memasukkan index.html
      - name: Siapkan File Web (www)
        run: |
          mkdir -p www
          cp index.html www/

      - name: Inisialisasi Project & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Nama aplikasi disesuaikan dengan isi index.html kamu
          npx cap init "Browser Simulator" com.browser.simulator --web-dir www
          npx cap add android
          npx cap sync android

      - name: Fix Error Duplicate Kotlin
        run: |
          cat <<EOF >> android/app/build.gradle
          
          configurations.all {
              resolutionStrategy {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Build File APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: headless-browser-simulator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
