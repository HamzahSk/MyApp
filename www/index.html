<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scraping Browser Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* --- Address Bar --- */
        .navbar {
            background-color: var(--surface-color);
            padding: 10px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }
        .navbar button {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }
        .url-input-container {
            flex-grow: 1;
            display: flex;
            background: var(--bg-color);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 5px 15px;
        }
        .url-input-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 14px;
        }
        /* --- Viewport (Browser Area) --- */
        .viewport {
            flex-grow: 1;
            position: relative;
            background: #ffffff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .overlay-loader {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            font-weight: bold;
        }
        /* --- Console/Tools Bottom Sheet --- */
        .tools-panel {
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            height: 250px;
            display: flex;
            flex-direction: column;
        }
        .tools-header {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: #888;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow-x: auto;
        }
        .action-buttons button {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
        }
        .console-log {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            background: #000;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px dashed #333; padding-bottom: 2px; }
        .log-success { color: #03dac6; }
        .log-error { color: #cf6679; }
    </style>
</head>
<body>

    <div class="navbar">
        <button onclick="goBack()">◀</button>
        <div class="url-input-container">
            <input type="url" id="urlInput" placeholder="Ketik URL (contoh: https://quotes.toscrape.com)" value="https://quotes.toscrape.com">
        </div>
        <button onclick="loadUrl()">GO</button>
    </div>

    <div class="viewport">
        <iframe id="browserFrame" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
        <div class="overlay-loader" id="loader">Memuat Halaman...</div>
    </div>

    <div class="tools-panel">
        <div class="tools-header">
            <span>🛠️ Scraping Tools</span>
            <span id="status">Status: Idle</span>
        </div>
        <div class="action-buttons">
            <button onclick="scrapeNative()">🌐 Scrape Native (Bypass CORS)</button>
            <button onclick="getCookies()">🍪 Cek Cookies</button>
            <button onclick="clearConsole()">🗑️ Clear</button>
        </div>
        <div class="console-log" id="consoleLog">
            <div class="log-entry log-success">Ready: UI Browser dimuat.</div>
        </div>
    </div>

    <script>
        const browserFrame = document.getElementById('browserFrame');
        const urlInput = document.getElementById('urlInput');
        const loader = document.getElementById('loader');
        const consoleLog = document.getElementById('consoleLog');
        const statusEl = document.getElementById('status');

        function log(msg, type = 'normal') {
            const div = document.createElement('div');
            div.className = `log-entry ${type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : ''}`;
            div.textContent = `> ${msg}`;
            consoleLog.appendChild(div);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function clearConsole() {
            consoleLog.innerHTML = '<div class="log-entry">Console dibersihkan.</div>';
        }

        // --- Fitur 1: Visual Browser (Iframe) ---
        function loadUrl() {
            let url = urlInput.value.trim();
            if (!url.startsWith('http')) url = 'https://' + url;
            
            log(`Mencoba memuat visual: ${url}`);
            loader.style.display = 'flex';
            
            // Catatan: Banyak website besar memblokir iframe (X-Frame-Options).
            // Ini normal. Untuk scraping sungguhan, kita pakai fitur Native di bawah.
            browserFrame.src = url;
            
            browserFrame.onload = () => {
                loader.style.display = 'none';
                log(`Selesai memuat iframe.`, 'success');
            };
            browserFrame.onerror = () => {
                loader.style.display = 'none';
                log(`Gagal memuat iframe (Mungkin diblokir X-Frame-Options).`, 'error');
            };
        }

        function goBack() {
            log("Fungsi back ditekan.");
            // Di iframe biasa history back agak sulit dikontrol, ini sekadar UI
        }

        // --- Fitur 2: Native Scraping (Bypass CORS via Capacitor) ---
        async function scrapeNative() {
            let url = urlInput.value.trim();
            if (!url) return log("URL kosong!", "error");
            if (!url.startsWith('http')) url = 'https://' + url;

            statusEl.textContent = "Status: Scraping...";
            log(`Mulai Native Fetch: ${url}`);

            try {
                // Mengecek apakah aplikasi jalan di Android (Capacitor)
                if (window.Capacitor && window.Capacitor.Plugins.CapacitorHttp) {
                    log("Menggunakan CapacitorHttp Native API...");
                    
                    const response = await Capacitor.Plugins.CapacitorHttp.request({
                        method: 'GET',
                        url: url,
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/114.0.0.0 Mobile Safari/537.36'
                        }
                    });

                    log(`Status Code: ${response.status}`, 'success');
                    log(`Data length: ${response.data.length} karakter`);
                    
                    // Mencetak sebagian HTML yang didapat
                    const preview = response.data.substring(0, 100).replace(/</g, '&lt;') + '...';
                    log(`Preview HTML: ${preview}`);

                } else {
                    // Fallback jika dibuka di browser PC biasa (akan kena CORS)
                    log("Capacitor Native tidak terdeteksi. Mencoba fetch biasa (bisa gagal karena CORS)...", "error");
                    const response = await fetch(url);
                    const html = await response.text();
                    log(`Sukses fetch biasa. Panjang HTML: ${html.length} char`, 'success');
                }
            } catch (err) {
                log(`Error Scraping: ${err.message}`, 'error');
            } finally {
                statusEl.textContent = "Status: Idle";
            }
        }

        // --- Fitur 3: Cek Cookies ---
        async function getCookies() {
            log("Mengecek Cookies...");
            if (window.Capacitor && window.Capacitor.Plugins.CapacitorCookies) {
                const url = urlInput.value.trim();
                const cookies = await Capacitor.Plugins.CapacitorCookies.getCookies({ url: url });
                log(`Cookies untuk ${url}: ${JSON.stringify(cookies)}`, 'success');
            } else {
                log(`Cookies document (Browser): ${document.cookie || 'Kosong'}`, 'normal');
            }
        }

        // Inisialisasi awal
        window.onload = () => {
            log("Menunggu Capacitor Bridge...");
            setTimeout(() => {
                if (window.Capacitor) log("✅ Berjalan di Android App!", 'success');
                else log("⚠️ Berjalan di Web Browser biasa.", 'error');
            }, 1000);
        };
    </script>
</body>
</html>
